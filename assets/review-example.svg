<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">Пример сверки площадей</title><desc id="desc">Демонстрационные данные: на плане 18 квадратных метров, в экспликации 20. Разница 2 квадратных метра требует проверки специалистом.</desc>
<rect width="1200" height="370" rx="22" fill="#123d43"/>
<g font-family="Arial, sans-serif">
<text x="36" y="42" font-size="15" fill="#b8d1cf">ДЕМОНСТРАЦИОННЫЕ ДАННЫЕ · НЕ СКРИНШОТ ИНТЕРФЕЙСА</text>
<rect x="36" y="68" width="347" height="214" rx="14" fill="#f7f4ec"/>
<rect x="402" y="68" width="347" height="214" rx="14" fill="#f7f4ec"/>
<rect x="768" y="68" width="396" height="214" rx="14" fill="#f7f4ec"/>
<g fill="#173f44">
<text x="60" y="105" font-size="17">ПЛАН · ЛИСТ 2</text><text x="60" y="148" font-size="23">Помещение № 12</text><text x="60" y="218" font-size="48" font-weight="bold">18,0 м²</text>
<text x="426" y="105" font-size="17">ЭКСПЛИКАЦИЯ · ЛИСТ 3</text><text x="426" y="148" font-size="23">Помещение № 12</text><text x="426" y="218" font-size="48" font-weight="bold">20,0 м²</text>
<text x="792" y="105" font-size="17" fill="#b64d3b">ТРЕБУЕТ СВЕРКИ</text><text x="792" y="152" font-size="29" font-weight="bold">Разница — 2,0 м²</text><text x="792" y="198" font-size="20">Открыть оба источника</text><text x="792" y="232" font-size="20">и проверить исходные данные.</text>
</g><text x="36" y="328" font-size="20" fill="#f7f4ec">Система показывает расхождение. Правильное значение подтверждает специалист.</text>
</g></svg>
